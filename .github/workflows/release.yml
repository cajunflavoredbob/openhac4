name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches VERSION
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"

      - name: Build driver packages
        run: python3 build.py

      - name: Verify package count
        run: |
          drivers=$(ls -d src/*/ | wc -l)
          built=$(ls dist/*.c4z | wc -l)
          echo "drivers=$drivers built=$built"
          test "$drivers" -eq "$built"

      - name: Extract changelog notes
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '$0 == "## " ver {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          if ! [ -s notes.md ]; then echo "See CHANGELOG.md" > notes.md; fi
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.c4z --title "$GITHUB_REF_NAME" --notes-file notes.md
